=key|value
# HYPOMAP PROC template
# Earthquake hypocenter maps from seismic catalog.
# Compatible RAWFORMAT are:
#   'hyp71sum2k' (HYPO71): reads from formatted file(s) defined in associated NODE's FID field.
#   'fdsnws-event': reads FDSN web service from base URL defined in associated NODE's FID field.
# See $WEBOBS{ROOT_CODE}/matlab/hypomap.m for further information.

# long name of the PROC
NAME|Lesser Antilles Seismicity
# proc TYPE and OWNER code (see OWNERS.conf for OWNCODEs)
RAWFORMAT|quakes
TYPE|
OWNCODE|?
# raw data path
RAWDATA|
# URN link to data 
URNDATA|
# time zone for outputs
TZ|0
# additionnal URL
URL|

# lists of parameters (number of comma-separated rows must be consistent)
# TIMESCALELIST valid suffix: h (hour), d (day), w (week), m (month), y (year)
TIMESCALELIST|01y,10y,all
DATESTRLIST|-1,-1,-1
MARKERSIZELIST|3,2,2

# additional summary graphs keywords (comma separated)
#SUMMARYLIST|Indonesia,Java,Jateng
SUMMARYLIST|Antilles,Martinique,Guadeloupe
SUMMARY_CHANNELS|

# execution command (for runproc shell)
SUBMIT_COMMAND|$WEBOBS{JOB_MCC} hypomap $SELFREF -
SUBMIT_RESOURCE|hypomap

# list of keys editable in requests
REQUEST_KEYLIST|NAME,SUMMARYLIST

# node parameters
NODE_NAME|node
NODE_SIZE|10
NODE_RGB|1,0,0
NODE_FONTSIZE|10
NODE_MARKER|o

# --- optional user-defined DEM, in ArcInfo format (overwrites SRTM/ETOPO default)
DEM_FILE|$WEBOBS{PATH_DATA_DEM}/exampledem.asc
# DEM coordinate system: UTM or LATLON
DEM_TYPE|LATLON
DEM_COPYRIGHT|

# graphical density for PNG outputs (in pixel per inches)
PPI|100
# value = 1 to produce EPS graphs
POSTSCRIPT|1
# value = 1 to export text data files
EXPORTS|1
# main logo file
LOGO_FILE|$WEBOBS{ROOT_CODE}/icons/ipgp/logo_WOVS.png
# secondary logo file
LOGO2_FILE|
# main copyright
COPYRIGHT|USGS
# secondary copyright
COPYRIGHT2|

# --- proc specific parameters
LATLIM|13,19
LONLIM|-64,-58
MAGLIM|4,10
DEPLIM|-2,300
MSKLIM|1,12
GAPLIM|0,360
RMSLIM|0,1
ERHLIM|0,100
ERZLIM|0,100
NPHLIM|3,Inf
CLALIM|0,4
QUALITY_FILTER|0.7
# for graph
MARKER_LINEWIDTH|1
# Hypocenters without individual circle line (1 yes, 0 no)
BUBBLE_PLOT|1
PLOT_BG_ALL|.3
DEM_OPT|'WaterMark',2,'FontSize',7
SHAPE_FILE|$WEBOBS{PATH_DATA_SHAPE}/antilles_faults.bln
#STATIONS_GRID|VIEW.

MAP_Antilles_TITLE|Antilles
MAP_Antilles_XYLIM|-64,-58,13,18.7
MAP_Antilles_MAGLIM|3,6
MAP_Antilles_DEPLIM|-2,200
MAP_Antilles_PROFILE1|-61.4651,16.5138,55,100,200
#MAP_Antilles_DEPTH_COLORMAP|jet(256)

MAP_Guadeloupe_TITLE|Guadeloupe
MAP_Guadeloupe_XYLIM|-62,-60,15.5,17.334
MAP_Guadeloupe_MAGLIM|3,6
MAP_Guadeloupe_DEPLIM|-2,200
MAP_Guadeloupe_PROFILE1|-61,16.4,55,100,200
MAP_Guadeloupe_COLORREF|time
MAP_Guadeloupe_COLORMAP|jet(256)

MAP_Martinique_TITLE|Martinique
MAP_Martinique_XYLIM|-61.6,-59.6,13.5,15.5
MAP_Martinique_MAGLIM|3,6
MAP_Martinique_DEPLIM|-2,200
MAP_Martinique_PROFILE1|-61.04,14.61,70,100,200
MAP_Martinique_COLORREF|time
MAP_Martinique_COLORMAP|jet(256)

################################################################################
# Upgrade to release WebObs-2.8.2 on vendredi 2026-08-14 04:19:51 UTC
# New configuration keys for file /opt/webobs/CONF/PROCS/HYPOWI/HYPOWI.conf

# description of what the proc does
DESCRIPTION|Earthquake hypocenter maps from seismic catalog

# defines a reference date to use with 'r01' timescale in TIMESCALELIST
REF01_DATE|2000-01-01

# year and month timescales use true durations
TIMESCALE_TRUEVALUE|Y

# auto refresh of graphic display
DISPLAY_AUTOREFRESH_SECONDS|3600

# additional options for gridmaps background map
GRIDMAPS_DEM_OPT|

# show node alias in zoom map(s)
NODE_SUBMAP_ALIAS|N

EXPORT_HEADER_NODE_KEYLIST|FID,NAME,LAT_WGS84,LON_WGS84,ALTITUDE,URL

EXPORT_HEADER_PROC_KEYLIST|

# outputs further vector files (in addition to EPS) for each graph. SVG is experimental
SVGOUTPUT|NO

PDFOUTPUT|NO

# for catalog data request
EVENTTYPE_EXCLUDED_LIST|not existing,not locatable,outside of network interest,sonic boom,duplicate,other event

EVENTSTATUS_EXCLUDED_LIST|automatic

EVENTCOMMENT_INCLUDED_REGEXP|

EVENTCOMMENT_EXCLUDED_REGEXP|AUTOMATIC

# search for string in the event comment to tag it as felt EQ
EVENTCOMMENT_FELT_REGEXP|

# search for event code (xxNrr) in the catalog comment
FELT_EVENTCODE_OK|NO

SC3_LISTEVT|

# -- Maps of areas: duplicate MAP_areaname_* keys to make specific maps
MAP_Area1_TITLE|Area1 - Lesser Antilles

# map limits: lon0,lat0,width (in degree) or former lon1,lon2,lat1,lat2 (in degree)
MAP_Area1_XYLIM|-61,16,6

# magnitude limits (not a filter, for marker size scaling only)
MAP_Area1_MAGLIM|3,7

# depth limits
MAP_Area1_DEPLIM|-2,200

# Profile 1 (bottom): center longitude, center latitude, azimuth (degree North), lateral distance (km), depth (km)
MAP_Area1_PROFILE1|-61.4651,16.5138,55,100,200

# Colormap used: must specify the number of colors
MAP_Area1_COLORMAP|spectral(256)

# Color reference for markers: 'depth' (default) or 'time'
MAP_Area1_COLORREF|time

################################################################################
