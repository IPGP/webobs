[loggers]
keys=root,webobs

[handlers]
keys=console
#keys=console,rotatingFile

[formatters]
keys=default

[logger_root]
level=ERROR
handlers=console

[logger_webobs]
level=INFO
#level=DEBUG
handlers=console
#handlers=console,rotatingFile
qualname=webobs
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=default
args=(sys.stdout,)

[handler_rotatingFile]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=default
args=('/tmp/webobs/webobs.log', 'a', 1048576, 5)

[formatter_default]
format=%(asctime)s - %(module)s (l. %(lineno)d) - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
