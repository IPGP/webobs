[loggers]
keys=root,genplot

[handlers]
keys=hand01

[formatters]
keys=form01

[logger_root]
level=ERROR
handlers=hand01

[logger_genplot]
level=INFO
handlers=hand01
qualname=genplot
propagate=0

[handler_hand01]
class=StreamHandler
level=DEBUG
formatter=form01
args=(sys.stdout,)

[formatter_form01]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
